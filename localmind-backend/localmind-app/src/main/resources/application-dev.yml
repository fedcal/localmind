spring:
  datasource:
    url: jdbc:mysql://localhost:3306/localmind?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: localmind
    password: localmind
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
      embedding:
        model: nomic-embed-text
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-20250514
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: localmind-documents
    mcp:
      server:
        name: localmind
        version: 0.1.0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  batch:
    job:
      enabled: false

localmind:
  llm:
    ollama:
      enabled: true
    openai:
      enabled: false
    anthropic:
      enabled: false
    google:
      enabled: false
    default-provider: OLLAMA
    retry:
      max-attempts: 3
      backoff-ms: 1000
    fallback:
      enabled: true
      order: OLLAMA,OPENAI,ANTHROPIC,GOOGLE
  document:
    upload-dir: ${user.home}/.localmind/uploads
    max-file-size: 50MB
    supported-types: pdf,docx,txt,eml
  batch:
    chunk-size: 500
    chunk-overlap: 50
    cron-folder-scan: "0 */15 * * * *"
  n8n:
    base-url: http://localhost:5678
    webhook-path: /webhook
  mcp:
    server:
      enabled: true
    client:
      enabled: true

logging:
  level:
    com.localmind: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
