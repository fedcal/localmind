# Configurazione Nginx per API Gateway microservizi LocalMind
# Nginx configuration for LocalMind microservices API Gateway

events {
    worker_connections 1024;
}

http {
    upstream chat_service {
        server chat-service:8081;
    }

    upstream document_service {
        server document-service:8082;
    }

    upstream mcp_service {
        server mcp-service:8083;
    }

    server {
        listen 80;

        # Chat & Conversation endpoints
        location /api/v1/chat {
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/conversations {
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/models {
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
        }

        # Document & Search endpoints
        location /api/v1/documents {
            proxy_pass http://document_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/search {
            proxy_pass http://document_service;
            proxy_set_header Host $host;
        }

        location /api/v1/folders {
            proxy_pass http://document_service;
            proxy_set_header Host $host;
        }

        # MCP endpoints
        location /api/v1/mcp {
            proxy_pass http://mcp_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Settings & Dashboard (via chat service per ora)
        location /api/v1/settings {
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
        }

        location /api/v1/dashboard {
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}
