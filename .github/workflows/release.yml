# ==========================================================
# Release - Build, Publish e Deploy su tag v*
# Release - Build, Publish and Deploy on v* tags
# ==========================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ── Build tutti gli artefatti / Build all artifacts ──
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # ── Backend JAR ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend JAR
        run: |
          cd localmind-backend
          mvn install -DskipTests -B
          cp localmind-app/target/localmind-app-*.jar ../localmind-backend-${{ steps.version.outputs.version }}.jar

      - name: Build SDK Java
        run: |
          cd localmind-sdk-java
          mvn package -B
          cp target/localmind-sdk-java-${{ steps.version.outputs.version }}.jar ../localmind-sdk-java-${{ steps.version.outputs.version }}.jar

      # ── Frontend ──
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd localmind-frontend
          npm ci
          npx ng build --configuration production
          tar -czf ../localmind-frontend-${{ steps.version.outputs.version }}.tar.gz -C dist/localmind-frontend/browser .

      # ── SDK JS ──
      - name: Build SDK JS
        run: |
          cd localmind-sdk-js
          npm ci
          npm run build
          npm pack
          mv *.tgz ../localmind-sdk-js-${{ steps.version.outputs.version }}.tgz

      # ── SDK Python ──
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SDK Python
        run: |
          cd localmind-sdk-python
          pip install build
          python -m build
          cp dist/*.tar.gz ../localmind-sdk-python-${{ steps.version.outputs.version }}.tar.gz
          cp dist/*.whl ../localmind-sdk-python-${{ steps.version.outputs.version }}.whl

      # ── Upload artefatti / Upload artifacts ──
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            localmind-backend-*.jar
            localmind-sdk-java-*.jar
            localmind-frontend-*.tar.gz
            localmind-sdk-js-*.tgz
            localmind-sdk-python-*.tar.gz
            localmind-sdk-python-*.whl

  # ── GitHub Release ──
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "LocalMind ${{ github.ref_name }}" \
            --generate-notes \
            ./artifacts/*

  # ── Publish SDK Java su Maven Central ──
  publish-maven:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_MAVEN == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central
        run: cd localmind-sdk-java && mvn deploy -Prelease -B -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # ── Publish SDK Python su PyPI ──
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_PYPI == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and publish to PyPI
        run: |
          cd localmind-sdk-python
          pip install build twine
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # ── Publish SDK JS su npm ──
  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        run: |
          cd localmind-sdk-js
          npm ci
          npm run build

      - name: Publish to npm
        run: cd localmind-sdk-js && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Push Docker images su GHCR ──
  push-docker:
    name: Push Docker Images
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:${{ needs.build.outputs.version }} \
                        -t ghcr.io/${{ github.repository }}/backend:latest \
                        -f Dockerfile .
          docker push ghcr.io/${{ github.repository }}/backend:${{ needs.build.outputs.version }}
          docker push ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:${{ needs.build.outputs.version }} \
                        -t ghcr.io/${{ github.repository }}/frontend:latest \
                        -f Dockerfile.frontend .
          docker push ghcr.io/${{ github.repository }}/frontend:${{ needs.build.outputs.version }}
          docker push ghcr.io/${{ github.repository }}/frontend:latest
