# ==========================================================
# CI - Test e Build su ogni Push/PR
# CI - Test and Build on every Push/PR
# ==========================================================

name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'documentation/**'
      - 'documentazione/**'
      - 'docs-site/**'
      - 'Sviluppi/**'
      - '*.md'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Unit Tests ──
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend unit tests
        run: cd localmind-backend && mvn test -B

  # ── Frontend Unit Tests ──
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: localmind-frontend/package-lock.json

      - name: Install dependencies
        run: cd localmind-frontend && npm ci

      - name: Run Vitest unit tests
        run: cd localmind-frontend && npm test

  # ── SDK Java Build ──
  sdk-java-build:
    name: SDK Java Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build SDK Java
        run: cd localmind-sdk-java && mvn package -B

  # ── SDK JS Build ──
  sdk-js-build:
    name: SDK JS Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: localmind-sdk-js/package-lock.json

      - name: Install dependencies
        run: cd localmind-sdk-js && npm ci

      - name: Build SDK JS
        run: cd localmind-sdk-js && npm run build

  # ── SDK Python Build ──
  sdk-python-build:
    name: SDK Python Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SDK Python
        run: |
          cd localmind-sdk-python
          pip install build
          python -m build
