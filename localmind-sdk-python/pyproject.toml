[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "localmind-sdk"
version = "1.0.0"
description = "Python SDK for LocalMind API - chat, documents, semantic search, and conversation management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["localmind", "llm", "sdk", "ai", "rag", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/localmind/localmind-sdk-python"
Repository = "https://github.com/localmind/localmind-sdk-python"

[tool.setuptools.packages.find]
include = ["localmind*"]
